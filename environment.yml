name: aifs
channels:
  - conda-forge
dependencies:
  # Core Python
  - python=3.11
  - pip

  # Numerical + data handling
  - numpy
  - pandas
  - pyyaml
  - scipy
  - xarray
  - cftime
  - netcdf4
  - h5netcdf
  - dask
  - bottleneck
  - numexpr

  # Plotting and mapping
  - matplotlib
  - jupyterlab
  - cartopy
  - shapely
  - pyproj
  - proj
  - geos
  - rasterio

  # ECMWF GRIB support
  - eccodes
  - cfgrib

  # Jupyter kernel support
  - ipykernel

  # Utilities
  - requests
  - tqdm
  - cdsapi

  # Pip-only packages (from ECMWF)
  - pip:
      - earthkit-data
      - ecmwf-opendata
      - earthkit-plots
      - earthkit-meteo
